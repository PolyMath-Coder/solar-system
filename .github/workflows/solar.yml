name: Solar system planet

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat--kodekloud

env:
  MONGODB_URI: "mongodb+srv://jamajamadb.5cue4.mongodb.net/solar-system"
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Run unit tests
    strategy:
      matrix:
        node-version: [18, 19, 20]
        operating-system: [ubuntu-latest]
        exclude:
          - node-version: 18
            operating-system: macos-latest
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        continue-on-error: true
        run: echo "Running unit tests..."
  code_coverage:
    name: Generate code coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Unit testing
        id: nodejs-unit-testing-step
        run: echo "Running code coveragetests..."

      # - name: Run coverage
      #   continue-on-error: true
      #   run: npm runcoverage

      # - name: Archive test result
      #   if: steps.nodejs-unit-testing-step.outcome == 'failure' || steps.nodejs-unit-testing-step.outcome == 'success'
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: coverage-report
      #     path: coverage
      #     retention-days: 5

  docker:
    name: "containerize application"
    needs: [unit-testing, code_coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dockerhub login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: GHCR login
        uses: docker/login-action@v3

      - name: Docker build for just testing..
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system-planet:${{ github.sha }}
      # - name: Build Docker image
      #   run: docker build -t solar-system-planet:latest .

      - name: Docker image testing
        run: |
          docker images
          docker run --name solar-system-app -d  \
              -p 3000:3000 \
              -e MONGODB_URI=$MONGODB_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKER_USERNAME }}/solar-system-planet:${{ github.sha }}

          export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"
          echo "Testing API endpoint..."
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Actual docker push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/solar-system-planet:${{ github.sha }}
            ghcr.io/${{github.repository_owner}}/
      # - name: Run Docker container
      #   run: docker run -d --name solar-system-planet-container solar-system-planet:latest

      # - name: Test Docker container
      #   run: docker exec solar-system-planet-container npm test

      # - name: Stop and remove Docker container
