name: Solar system

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat--kodekloud

env:
  MONGODB_URI: "mongodb+srv://@jamajamadb.5cue4.mongodb.net/solar-system"
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
